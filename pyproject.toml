[project]
name = "orders-stock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "httpx2>=2.16.2",
    "pydantic>=2.14.3",
    "psycopg[binary]>=3.3.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
orders-worker = "orders_stock.worker:main"
orders-db = "orders_stock.db:main"
orders-demo = "orders_stock.demo:main"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
orders_stock = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
